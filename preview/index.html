<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>节节高 · 多端响应式预览 (port 9999)</title>
  <style>
    :root {
      --bg: #0d1b2a;
      --card: #1b2735;
      --text: #e8edf2;
      --muted: #8a98a8;
      --gold: #d4af37;
      --border: #2a3a4e;
      --accent: #4a90e2;
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #060c14;
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      z-index: 100;
    }
    .topbar h1 { font-size: 16px; color: var(--gold); font-weight: 600; }
    .topbar .meta { color: var(--muted); font-size: 12px; }
    .topbar .status { padding: 4px 10px; border-radius: 4px; font-size: 11px; }
    .topbar .status.ok { background: #1a3a1a; color: #6ad36a; }
    .topbar .status.err { background: #3a1a1a; color: #d36a6a; }
    .topbar .spacer { flex: 1; }
    .topbar button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .topbar button:hover { border-color: var(--gold); color: var(--gold); }

    .layout {
      display: flex;
      margin-top: 56px;
      min-height: calc(100vh - 56px);
    }

    /* ========== 左侧栏 ========== */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-section {
      margin-bottom: 18px;
    }
    .sidebar-section h2 {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-section h2 .badge {
      background: var(--border);
      color: var(--text);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 500;
    }

    .group {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      background: var(--bg);
      overflow: hidden;
    }
    .group-header {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: var(--card);
      user-select: none;
    }
    .group-header:hover { background: #243140; }
    .group-header .arrow { transition: transform 0.2s; color: var(--muted); font-size: 9px; }
    .group.open .group-header .arrow { transform: rotate(90deg); }
    .group-header .count {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
      background: var(--border);
      padding: 1px 5px;
      border-radius: 3px;
    }
    .group-body {
      display: none;
      padding: 4px 0;
    }
    .group.open .group-body { display: block; }
    .device-item {
      display: flex;
      align-items: center;
      padding: 6px 10px 6px 26px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      gap: 8px;
      border-left: 2px solid transparent;
    }
    .device-item:hover { background: rgba(212, 175, 55, 0.08); }
    .device-item.selected {
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold);
      border-left-color: var(--gold);
    }
    .device-item .spec {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
    }
    .device-item.selected .spec { color: var(--gold); }

    /* ========== 控制条（横竖屏 + 分辨率） ========== */
    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .controls .row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .controls .row:last-child { margin-bottom: 0; }
    .controls label {
      font-size: 11px;
      color: var(--muted);
      min-width: 60px;
      flex-shrink: 0;
    }
    .controls select {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .controls select:focus { outline: none; border-color: var(--gold); }
    .controls select:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .controls .hint {
      font-size: 10px;
      color: var(--muted);
      font-style: italic;
      margin-top: 6px;
    }

    /* ========== 主区域 ========== */
    .main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .main-empty {
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }
    .main-empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

    .device-stage {
      width: 100%;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ========== 设备卡片 ========== */
    .device {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .device-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 11px;
      color: var(--muted);
      gap: 8px;
    }
    .device-name { font-weight: 600; color: var(--gold); font-size: 13px; }
    .device-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--text);
      white-space: nowrap;
    }
    .device-tag.ios { background: #1a3a1a; color: #6ad36a; }
    .device-tag.android { background: #3a2a1a; color: #d4a06a; }
    .device-tag.mp { background: #1a2a3a; color: #6ad4d4; }
    .device-tag.foldable { background: #3a1a3a; color: #d46ad4; }
    .device-dim { color: var(--accent); font-size: 10px; }

    .device-frame {
      border: 2px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg);
      position: relative;
    }
    .device-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg);
      display: block;
    }

    /* ========== 设备外壳 ========== */
    .device[data-form="phone"] .device-frame {
      border-radius: 24px;
      padding: 6px;
      border: 8px solid #1a1a1a;
      background: #1a1a1a;
    }
    .device[data-form="phone"] .device-frame iframe { border-radius: 16px; }

    .device[data-form="foldable"] .device-frame {
      border-radius: 32px;
      padding: 6px 4px;
      border: 8px solid #1a1a1a;
      background: #1a1a1a;
      position: relative;
    }
    .device[data-form="foldable"] .device-frame::before {
      content: "";
      position: absolute;
      left: 50%; top: 6px; bottom: 6px;
      width: 2px;
      background: linear-gradient(180deg, transparent, #444 20%, #444 80%, transparent);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 1;
    }

    /* ========== 微信小程序外壳（按微信文档真实还原） ========== */
    .device[data-form="mp"] .device-frame {
      border-radius: 6px;
      padding: 0;
      border: none;
      background: #ededed;
      overflow: hidden;
    }
    .device[data-form="mp"] .device-frame::before { content: none; }
    .mp-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #ededed;
    }
    /* 微信状态栏：时间左 + 信号右 + 右侧胶囊 */
    .mp-statusbar {
      height: 24px;
      background: #ededed;
      display: flex;
      align-items: center;
      padding: 0 12px 0 8px;
      gap: 6px;
      font-size: 11px;
      color: #000;
      font-weight: 600;
      flex-shrink: 0;
    }
    .mp-statusbar .time { font-size: 11px; }
    .mp-statusbar .icons { margin-left: auto; display: flex; gap: 4px; align-items: center; }
    /* 微信胶囊：width:87px height:32px, 距右 10px, 距顶 6px (适配 24px 状态栏时已含胶囊) */
    .mp-capsule {
      width: 87px;
      height: 24px;
      border: 1px solid rgba(0,0,0,0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5px;
      box-sizing: border-box;
    }
    .mp-capsule .dot {
      width: 14px;
      height: 14px;
      border: 1px solid rgba(0,0,0,0.5);
      border-radius: 50%;
      position: relative;
    }
    .mp-capsule .dot::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.3);
    }
    .mp-capsule .bar {
      width: 14px;
      height: 1px;
      background: rgba(0,0,0,0.5);
    }
    /* 微信导航栏：高度 = (胶囊顶部 - 状态栏底) + 胶囊 + (胶囊底部-屏幕顶) ≈ 44px */
    .mp-navbar {
      height: 44px;
      background: #ededed;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      font-size: 13px;
      color: #000;
      flex-shrink: 0;
      position: relative;
    }
    .mp-navbar .back {
      font-size: 18px;
      color: #000;
      width: 32px;
      text-align: left;
    }
    .mp-navbar .title {
      font-weight: 500;
      flex: 1;
      text-align: center;
      padding-right: 32px; /* 抵消 back 按钮宽度让标题居中 */
    }
    .mp-navbar .more {
      font-size: 18px;
      color: #000;
      width: 32px;
      text-align: right;
      letter-spacing: 1px;
    }
    .mp-body {
      flex: 1;
      position: relative;
      background: #ededed;
      overflow: hidden;
    }
    .mp-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    /* 微信 tabbar：高度 49px (iOS) / 56px (Android) */
    .mp-tabbar {
      height: 49px;
      background: #f7f7f7;
      border-top: 1px solid rgba(0,0,0,0.1);
      display: flex;
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .mp-tabbar-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #888;
      gap: 2px;
    }
    .mp-tabbar-item .icon {
      width: 18px; height: 18px;
      border-radius: 4px;
      background: #ccc;
    }
    .mp-tabbar-item.active { color: #1aad19; }
    .mp-tabbar-item.active .icon { background: #1aad19; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>📱 节节高 · 多端响应式预览</h1>
    <span class="meta">port 9999</span>
    <span class="spacer"></span>
    <span class="meta">后端: <span id="backend-status" class="status">检测中</span></span>
    <span class="meta">H5: <a href="http://localhost:9000/" target="_blank" style="color:var(--accent);text-decoration:none;">9000 ↗</a></span>
    <button onclick="reloadAll()">⟳ 重载</button>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h2>📱 设备选择 <span class="badge">单选</span></h2>

        <div class="group open" id="g-ios">
          <div class="group-header" onclick="toggleGroup('g-ios')">
            <span class="arrow">▶</span><span>🍎 iOS · 苹果直板机</span>
            <span class="count" id="count-ios">0</span>
          </div>
          <div class="group-body" id="body-ios"></div>
        </div>

        <div class="group" id="g-android">
          <div class="group-header" onclick="toggleGroup('g-android')">
            <span class="arrow">▶</span><span>🤖 Android · 国内畅销直板机</span>
            <span class="count" id="count-android">0</span>
          </div>
          <div class="group-body" id="body-android"></div>
        </div>

        <div class="group" id="g-foldable">
          <div class="group-header" onclick="toggleGroup('g-foldable')">
            <span class="arrow">▶</span><span>📱 Android · 国内折叠屏</span>
            <span class="count" id="count-foldable">0</span>
          </div>
          <div class="group-body" id="body-foldable"></div>
        </div>

        <div class="group" id="g-mp">
          <div class="group-header" onclick="toggleGroup('g-mp')">
            <span class="arrow">▶</span><span>💬 微信小程序</span>
            <span class="count" id="count-mp">0</span>
          </div>
          <div class="group-body" id="body-mp"></div>
        </div>
      </div>

      <div class="sidebar-section">
        <h2>⚙️ 显示控制</h2>
        <div class="controls">
          <div class="row">
            <label>横竖屏</label>
            <select id="ctrl-orient" onchange="onOrientChange()">
              <option value="portrait">竖屏</option>
              <option value="landscape">横屏</option>
            </select>
          </div>
          <div class="row">
            <label>分辨率</label>
            <select id="ctrl-resolution" onchange="onResolutionChange()">
              <option value="auto">跟随设备</option>
              <option value="custom">自定义</option>
              <option value="720x1280">720×1280 (HD)</option>
              <option value="1080x1920">1080×1920 (FHD)</option>
              <option value="1440x3200">1440×3200 (QHD)</option>
              <option value="375x667">375×667 (iPhone SE)</option>
              <option value="390x844">390×844 (iPhone 12)</option>
              <option value="393x852">393×852 (iPhone 14)</option>
              <option value="412x915">412×915 (小米14)</option>
              <option value="432x960">432×960 (Mate60)</option>
              <option value="720x840">720×840 (Mate X5)</option>
            </select>
          </div>
          <div id="custom-res" style="display:none;" class="row">
            <label>宽×高</label>
            <input type="number" id="ctrl-w" placeholder="宽" style="width:55px;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:4px;border-radius:4px;font-size:11px;" />
            <span style="color:var(--muted);">×</span>
            <input type="number" id="ctrl-h" placeholder="高" style="width:55px;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:4px;border-radius:4px;font-size:11px;" />
          </div>
          <div class="hint" id="ctrl-hint">微信小程序不支持横屏切换</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="device-stage" id="stage">
        <div class="main-empty">
          <div class="icon">📱</div>
          <div>从左侧选择一个设备型号开始预览</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ========== 设备库（按品牌分组） ==========
    const DEVICES = [
      // iOS
      { id: 'iphone-14-pro', brand: 'ios', form: 'phone', name: 'iPhone 14 Pro', w: 393, h: 852 },
      { id: 'iphone-15', brand: 'ios', form: 'phone', name: 'iPhone 15', w: 393, h: 852 },
      { id: 'iphone-15-pro-max', brand: 'ios', form: 'phone', name: 'iPhone 15 Pro Max', w: 430, h: 932 },
      { id: 'iphone-se', brand: 'ios', form: 'phone', name: 'iPhone SE (3rd)', w: 375, h: 667 },

      // Android 直板机
      { id: 'huawei-mate60', brand: 'huawei', form: 'phone', name: '华为 Mate 60 Pro', w: 432, h: 960 },
      { id: 'huawei-p60', brand: 'huawei', form: 'phone', name: '华为 P60 Pro', w: 414, h: 896 },
      { id: 'xiaomi-14', brand: 'xiaomi', form: 'phone', name: '小米 14', w: 412, h: 915 },
      { id: 'xiaomi-14-pro', brand: 'xiaomi', form: 'phone', name: '小米 14 Pro', w: 432, h: 960 },
      { id: 'xiaomi-13', brand: 'xiaomi', form: 'phone', name: '小米 13', w: 393, h: 873 },
      { id: 'oppo-findx7', brand: 'oppo', form: 'phone', name: 'OPPO Find X7 Ultra', w: 432, h: 960 },
      { id: 'oppo-r11', brand: 'oppo', form: 'phone', name: 'OPPO Reno 11', w: 412, h: 915 },
      { id: 'vivo-x100', brand: 'vivo', form: 'phone', name: 'vivo X100 Pro', w: 432, h: 960 },
      { id: 'vivo-s18', brand: 'vivo', form: 'phone', name: 'vivo S18', w: 412, h: 915 },
      { id: 'honor-magic6', brand: 'honor', form: 'phone', name: '荣耀 Magic 6', w: 432, h: 960 },
      { id: 'honor-100', brand: 'honor', form: 'phone', name: '荣耀 100', w: 412, h: 915 },

      // Android 折叠屏（仅展开内屏）
      { id: 'huawei-mate-x5', brand: 'huawei', form: 'foldable', name: '华为 Mate X5 展开', w: 720, h: 840 },
      { id: 'xiaomi-mix-fold3', brand: 'xiaomi', form: 'foldable', name: '小米 MIX Fold 3 展开', w: 720, h: 960 },
      { id: 'oppo-find-n3', brand: 'oppo', form: 'foldable', name: 'OPPO Find N3 展开', w: 720, h: 792 },
      { id: 'vivo-x-fold3', brand: 'vivo', form: 'foldable', name: 'vivo X Fold3 展开', w: 720, h: 960 },
      { id: 'honor-magic-v2', brand: 'honor', form: 'foldable', name: '荣耀 Magic V2 展开', w: 720, h: 892 },
      { id: 'honor-magic-vs3', brand: 'honor', form: 'foldable', name: '荣耀 Magic Vs3 展开', w: 720, h: 892 },

      // 微信小程序（直板机 + 折叠机展开内屏）
      { id: 'mp-iphone-15', brand: 'mp', form: 'mp', name: '微信 · iPhone 15', w: 393, h: 852 },
      { id: 'mp-iphone-se', brand: 'mp', form: 'mp', name: '微信 · iPhone SE', w: 375, h: 667 },
      { id: 'mp-huawei-mate60', brand: 'mp', form: 'mp', name: '微信 · 华为 Mate 60 Pro', w: 432, h: 960 },
      { id: 'mp-xiaomi-14', brand: 'mp', form: 'mp', name: '微信 · 小米 14', w: 412, h: 915 },
      { id: 'mp-oppo-findx7', brand: 'mp', form: 'mp', name: '微信 · OPPO Find X7', w: 432, h: 960 },
      { id: 'mp-vivo-x100', brand: 'mp', form: 'mp', name: '微信 · vivo X100', w: 432, h: 960 },
      { id: 'mp-honor-magic6', brand: 'mp', form: 'mp', name: '微信 · 荣耀 Magic 6', w: 432, h: 960 },
      { id: 'mp-huawei-mate-x5', brand: 'mp', form: 'mp', name: '微信 · 华为 Mate X5 展开', w: 720, h: 840 },
      { id: 'mp-honor-magic-v2', brand: 'mp', form: 'mp', name: '微信 · 荣耀 Magic V2 展开', w: 720, h: 892 },
    ];

    const BRAND_LABEL = {
      'ios': 'Apple', 'huawei': '华为', 'xiaomi': '小米',
      'oppo': 'OPPO', 'vivo': 'vivo', 'honor': '荣耀', 'mp': '通用',
    };

    // ========== 状态 ==========
    const state = {
      selectedId: null,   // 当前选中的设备 id
      orient: 'portrait',
      resolution: 'auto', // auto | custom | 预设
      customW: 0,
      customH: 0,
    };

    // ========== 渲染左侧栏 ==========
    function buildSidebar() {
      const groups = {
        ios: DEVICES.filter(d => d.brand === 'ios'),
        android: DEVICES.filter(d => d.brand !== 'ios' && d.form === 'phone'),
        foldable: DEVICES.filter(d => d.form === 'foldable'),
        mp: DEVICES.filter(d => d.brand === 'mp'),
      };

      Object.entries(groups).forEach(([key, list]) => {
        const body = document.getElementById('body-' + key);
        const count = document.getElementById('count-' + key);
        if (count) count.textContent = list.length;

        // 按品牌分子组
        const byBrand = {};
        list.forEach(d => {
          const b = d.brand;
          if (!byBrand[b]) byBrand[b] = [];
          byBrand[b].push(d);
        });

        body.innerHTML = Object.entries(byBrand).map(([brand, items]) => {
          const brandName = BRAND_LABEL[brand] || brand;
          const subId = `sub-${key}-${brand}`;
          return `
            <div class="group open" id="${subId}">
              <div class="group-header" onclick="toggleGroup('${subId}')">
                <span class="arrow">▶</span><span>${brandName}</span>
                <span class="count">${items.length}</span>
              </div>
              <div class="group-body" style="display:block;">
                ${items.map(d => `
                  <div class="device-item ${d.id === state.selectedId ? 'selected' : ''}"
                       id="item-${d.id}"
                       data-device-id="${d.id}"
                       onclick="selectDevice('${d.id}')">
                    <span>${d.name}</span>
                    <span class="spec">${d.w}×${d.h}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('');
      });
    }

    function toggleGroup(gid) {
      document.getElementById(gid)?.classList.toggle('open');
    }

    // ========== 选中设备 ==========
    function selectDevice(id) {
      state.selectedId = id;
      // 更新高亮
      document.querySelectorAll('.device-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.deviceId === id);
      });
      // 微信小程序：禁横屏切换
      const dev = DEVICES.find(d => d.id === id);
      const isMp = dev?.form === 'mp';
      document.getElementById('ctrl-orient').disabled = isMp;
      document.getElementById('ctrl-hint').textContent = isMp
        ? '微信小程序禁用横屏切换（开发者无需关心横屏）'
        : '单选设备，下拉切换横竖屏与分辨率';
      renderStage();
    }

    function onOrientChange() {
      state.orient = document.getElementById('ctrl-orient').value;
      renderStage();
    }

    function onResolutionChange() {
      const v = document.getElementById('ctrl-resolution').value;
      state.resolution = v;
      document.getElementById('custom-res').style.display = v === 'custom' ? 'flex' : 'none';
      if (v === 'custom') {
        const w = parseInt(document.getElementById('ctrl-w').value) || 0;
        const h = parseInt(document.getElementById('ctrl-h').value) || 0;
        state.customW = w; state.customH = h;
      }
      renderStage();
    }

    // 监听自定义输入
    document.addEventListener('input', (e) => {
      if (e.target.id === 'ctrl-w' || e.target.id === 'ctrl-h') {
        state.customW = parseInt(document.getElementById('ctrl-w').value) || 0;
        state.customH = parseInt(document.getElementById('ctrl-h').value) || 0;
        if (state.resolution === 'custom') renderStage();
      }
    });

    // ========== 解析最终宽高 ==========
    function resolveDimensions(dev) {
      let w = dev.w, h = dev.h;
      // 横屏切换
      if (state.orient === 'landscape' && dev.form !== 'mp') {
        [w, h] = [h, w];
      }
      // 分辨率覆盖
      if (state.resolution === 'custom' && state.customW > 0 && state.customH > 0) {
        w = state.customW; h = state.customH;
      } else if (state.resolution !== 'auto' && state.resolution.includes('x')) {
        const [rw, rh] = state.resolution.split('x').map(Number);
        w = rw; h = rh;
        if (state.orient === 'landscape' && dev.form !== 'mp') {
          [w, h] = [h, w];
        }
      }
      return { w, h };
    }

    // ========== 渲染主区域 ==========
    function renderStage() {
      const stage = document.getElementById('stage');
      if (!state.selectedId) {
        stage.innerHTML = `<div class="main-empty"><div class="icon">📱</div><div>从左侧选择一个设备型号开始预览</div></div>`;
        return;
      }
      const dev = DEVICES.find(d => d.id === state.selectedId);
      if (!dev) return;
      const { w, h } = resolveDimensions(dev);
      stage.innerHTML = deviceCard(dev, w, h);
    }

    function deviceCard(dev, w, h) {
      const isLandscape = w > h;
      const orientText = isLandscape ? '横屏' : '竖屏';
      const formTag = ({
        'phone': { class: 'phone', text: '手机' },
        'foldable': { class: 'foldable', text: '折叠屏' },
        'mp': { class: 'mp', text: '小程序' },
      })[dev.form];
      const brandTag = ({
        'ios': 'iOS', 'huawei': 'Harmony', 'xiaomi': 'MIUI',
        'oppo': 'ColorOS', 'vivo': 'OriginOS', 'honor': 'MagicOS',
      })[dev.brand] || '通用';

      // iframe 高度按比例算（限制 360~720px）
      const aspect = w / h;
      const heightPx = Math.min(720, Math.max(360, 480 / aspect));
      const iframeUrl = `http://localhost:9000/?device=${encodeURIComponent(dev.name)}&w=${w}&h=${h}&orient=${orientText}`;

      let frameInner;
      if (dev.form === 'mp') {
        frameInner = `
          <div class="mp-shell">
            <div class="mp-statusbar">
              <span class="time">15:21</span>
              <span class="icons">📶 🔋</span>
              <div class="mp-capsule">
                <div class="dot"></div>
                <div class="bar"></div>
              </div>
            </div>
            <div class="mp-navbar">
              <span class="back">‹</span>
              <span class="title">节节高</span>
              <span class="more">···</span>
            </div>
            <div class="mp-body">
              <iframe src="${iframeUrl}" loading="lazy"
                      sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            </div>
            <div class="mp-tabbar">
              <div class="mp-tabbar-item active"><div class="icon"></div>新闻</div>
              <div class="mp-tabbar-item"><div class="icon"></div>研报</div>
              <div class="mp-tabbar-item"><div class="icon"></div>持仓</div>
            </div>
          </div>
        `;
      } else {
        frameInner = `<iframe src="${iframeUrl}" loading="lazy"
                             sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
      }

      return `
        <div class="device" data-form="${dev.form}" data-orient="${orientText}">
          <div class="device-label">
            <span class="device-name">${dev.name}</span>
            <span class="device-tag ${formTag.class}">${formTag.text}</span>
            <span class="device-tag">${brandTag}</span>
          </div>
          <div class="device-label">
            <span class="device-dim">${w}×${h} · ${orientText} · ${state.resolution === 'auto' ? '跟随设备' : state.resolution}</span>
          </div>
          <div class="device-frame" style="height:${heightPx}px; width:auto; aspect-ratio:${w}/${h}; max-width:100%;">
            ${frameInner}
          </div>
        </div>
      `;
    }

    function reloadAll() {
      document.querySelectorAll('iframe').forEach(f => f.src = f.src);
    }

    // ========== 初始化 ==========
    buildSidebar();
    selectDevice('iphone-15-pro-max'); // 默认 iPhone 15 Pro Max

    // 后端探活
    fetch('http://localhost:9999/api/health')
      .then(r => r.json())
      .then(j => {
        const s = document.getElementById('backend-status');
        s.textContent = '✓ ' + (j.service || 'ok') + ' [turso]';
        s.className = 'status ok';
      })
      .catch(() => {
        const s = document.getElementById('backend-status');
        s.textContent = '✗ 9999 offline';
        s.className = 'status err';
      });
  </script>
</body>
</html>
