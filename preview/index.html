<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>节节高 · 多端响应式预览 (port 9999)</title>
  <style>
    :root {
      --bg: #0d1b2a;
      --card: #1b2735;
      --text: #e8edf2;
      --muted: #8a98a8;
      --gold: #d4af37;
      --border: #2a3a4e;
      --accent: #4a90e2;
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #060c14;
      color: var(--text);
      min-height: 100vh;
    }

    /* ========== 顶部状态条 ========== */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      z-index: 100;
    }
    .topbar h1 { font-size: 16px; color: var(--gold); font-weight: 600; }
    .topbar .meta { color: var(--muted); font-size: 12px; }
    .topbar .status { padding: 4px 10px; border-radius: 4px; font-size: 11px; }
    .topbar .status.ok { background: #1a3a1a; color: #6ad36a; }
    .topbar .status.err { background: #3a1a1a; color: #d36a6a; }
    .topbar .spacer { flex: 1; }
    .topbar button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .topbar button:hover { border-color: var(--gold); color: var(--gold); }

    /* ========== 整体布局 ========== */
    .layout {
      display: flex;
      margin-top: 56px;
      min-height: calc(100vh - 56px);
    }

    /* ========== 左侧栏 ========== */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar h2 {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 16px 0 8px;
      font-weight: 600;
    }
    .sidebar h2:first-child { margin-top: 0; }

    .group {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      background: var(--bg);
      overflow: hidden;
    }
    .group-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      background: var(--card);
      user-select: none;
    }
    .group-header:hover { background: #243140; }
    .group-header .arrow { transition: transform 0.2s; color: var(--muted); font-size: 10px; }
    .group.open .group-header .arrow { transform: rotate(90deg); }
    .group-header .count {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      background: var(--border);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .group-body {
      display: none;
      padding: 6px 0;
    }
    .group.open .group-body { display: block; }
    .device-item {
      display: flex;
      align-items: center;
      padding: 7px 12px 7px 28px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s;
      gap: 8px;
    }
    .device-item:hover { background: rgba(212, 175, 55, 0.08); }
    .device-item.checked { background: rgba(212, 175, 55, 0.15); color: var(--gold); }
    .device-item input { cursor: pointer; }
    .device-item .spec {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
    }

    .sidebar-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .sidebar-actions button {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
    .sidebar-actions button:hover { border-color: var(--gold); color: var(--gold); }

    /* ========== 主区域 ========== */
    .main {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .main-empty {
      color: var(--muted);
      padding: 80px;
      text-align: center;
      font-size: 14px;
    }
    .stage {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 20px;
    }

    /* ========== 设备卡片 ========== */
    .device {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .device-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .device-name { font-weight: 600; color: var(--gold); font-size: 13px; }
    .device-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--text);
    }
    .device-tag.ios { background: #1a3a1a; color: #6ad36a; }
    .device-tag.android { background: #3a2a1a; color: #d4a06a; }
    .device-tag.mp { background: #1a2a3a; color: #6ad4d4; }
    .device-tag.foldable { background: #3a1a3a; color: #d46ad4; }
    .device-dim { color: var(--accent); font-size: 10px; }

    .device-frame {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg);
      position: relative;
    }
    .device-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg);
    }

    /* ========== 设备外壳 ========== */
    .device[data-form="phone"] .device-frame {
      border-radius: 24px;
      padding: 6px;
      border: 8px solid #1a1a1a;
      background: #1a1a1a;
    }
    .device[data-form="phone"] .device-frame iframe { border-radius: 16px; }

    .device[data-form="foldable"] .device-frame {
      border-radius: 32px;
      padding: 6px 4px;
      border: 8px solid #1a1a1a;
      background: #1a1a1a;
      position: relative;
    }
    .device[data-form="foldable"] .device-frame::before {
      content: "";
      position: absolute;
      left: 50%; top: 6px; bottom: 6px;
      width: 2px;
      background: linear-gradient(180deg, transparent, #444 20%, #444 80%, transparent);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 1;
    }

    /* ========== 微信小程序外壳 ========== */
    .device[data-form="mp"] .device-frame {
      border-radius: 6px;
      padding: 0;
      border: none;
      background: #ededed;
      overflow: hidden;
    }
    .device[data-form="mp"] .device-frame::before {
      content: none;
    }
    .mp-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #ededed;
    }
    .mp-statusbar {
      height: 24px;
      background: #f7f7f7;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 6px;
      font-size: 10px;
      color: #000;
      font-weight: 600;
      flex-shrink: 0;
    }
    .mp-statusbar .time { font-size: 11px; }
    .mp-statusbar .icons { margin-left: auto; display: flex; gap: 4px; }
    .mp-capsule {
      margin-left: 8px;
      width: 60px;
      height: 18px;
      border: 1px solid #000;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .mp-capsule::before { content: ""; width: 10px; height: 8px; background: #000; border-radius: 1px; }
    .mp-capsule::after { content: ""; width: 8px; height: 1px; background: #000; }
    .mp-navbar {
      height: 32px;
      background: #ededed;
      border-bottom: 1px solid #d0d0d0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      font-size: 11px;
      color: #000;
      flex-shrink: 0;
    }
    .mp-navbar .back { font-size: 14px; color: #000; }
    .mp-navbar .title { font-weight: 500; flex: 1; text-align: center; }
    .mp-navbar .more { font-size: 16px; letter-spacing: 2px; color: #000; }
    .mp-body {
      flex: 1;
      position: relative;
      background: #ededed;
    }
    .mp-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .mp-tabbar {
      height: 40px;
      background: #f7f7f7;
      border-top: 1px solid #d0d0d0;
      display: flex;
      flex-shrink: 0;
    }
    .mp-tabbar-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #888;
      gap: 2px;
    }
    .mp-tabbar-item .icon {
      width: 16px; height: 16px;
      border-radius: 4px;
      background: #ccc;
    }
    .mp-tabbar-item.active { color: #1aad19; }
    .mp-tabbar-item.active .icon { background: #1aad19; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>📱 节节高 · 多端响应式预览</h1>
    <span class="meta">port 9999</span>
    <span class="spacer"></span>
    <span class="meta">后端: <span id="backend-status" class="status">检测中</span></span>
    <span class="meta">H5: <a href="http://localhost:9000/" target="_blank" style="color:var(--accent);text-decoration:none;">9000 ↗</a></span>
    <button onclick="reloadAll()">⟳ 重载</button>
  </div>

  <div class="layout">
    <!-- ============ 左侧栏 ============ -->
    <aside class="sidebar">
      <div class="sidebar-actions">
        <button onclick="selectAll(true)">全选</button>
        <button onclick="selectAll(false)">全清</button>
        <button onclick="selectRecommended()">推荐</button>
      </div>

      <h2>🍎 iOS · 苹果直板机</h2>
      <div id="group-ios"></div>

      <h2>🤖 Android · 国内畅销直板机</h2>
      <div id="group-android"></div>

      <h2>📱 Android · 国内折叠屏</h2>
      <div id="group-foldable"></div>

      <h2>💬 微信小程序 · 套外框</h2>
      <div id="group-mp"></div>
    </aside>

    <!-- ============ 主区域 ============ -->
    <main class="main">
      <div class="stage" id="stage">
        <div class="main-empty">从左侧勾选要预览的设备型号</div>
      </div>
    </main>
  </div>

  <script>
    // ========================================================================
    // 设备规格库（来自公开厂商资料）
    // ========================================================================
    const DEVICES = [
      // ========== iOS 直板机 ==========
      { id: 'iphone-14-pro', brand: 'ios', form: 'phone', name: 'iPhone 14 Pro', dim: '393×852', w: 393, h: 852, ratio: '19.5:9' },
      { id: 'iphone-15', brand: 'ios', form: 'phone', name: 'iPhone 15', dim: '393×852', w: 393, h: 852, ratio: '19.5:9' },
      { id: 'iphone-15-pro-max', brand: 'ios', form: 'phone', name: 'iPhone 15 Pro Max', dim: '430×932', w: 430, h: 932, ratio: '19.5:9' },
      { id: 'iphone-se', brand: 'ios', form: 'phone', name: 'iPhone SE (3rd)', dim: '375×667', w: 375, h: 667, ratio: '16:9' },

      // ========== Android 国内畅销直板机 ==========
      { id: 'huawei-mate60', brand: 'huawei', form: 'phone', name: '华为 Mate 60 Pro', dim: '432×960', w: 432, h: 960, ratio: '19.8:9' },
      { id: 'huawei-p60', brand: 'huawei', form: 'phone', name: '华为 P60 Pro', dim: '414×896', w: 414, h: 896, ratio: '19.8:9' },
      { id: 'xiaomi-14', brand: 'xiaomi', form: 'phone', name: '小米 14', dim: '412×915', w: 412, h: 915, ratio: '20:9' },
      { id: 'xiaomi-14-pro', brand: 'xiaomi', form: 'phone', name: '小米 14 Pro', dim: '432×960', w: 432, h: 960, ratio: '20:9' },
      { id: 'xiaomi-13', brand: 'xiaomi', form: 'phone', name: '小米 13', dim: '393×873', w: 393, h: 873, ratio: '20:9' },
      { id: 'oppo-findx7', brand: 'oppo', form: 'phone', name: 'OPPO Find X7 Ultra', dim: '432×960', w: 432, h: 960, ratio: '20:9' },
      { id: 'oppo-r11', brand: 'oppo', form: 'phone', name: 'OPPO Reno 11', dim: '412×915', w: 412, h: 915, ratio: '20:9' },
      { id: 'vivo-x100', brand: 'vivo', form: 'phone', name: 'vivo X100 Pro', dim: '432×960', w: 432, h: 960, ratio: '20:9' },
      { id: 'vivo-s18', brand: 'vivo', form: 'phone', name: 'vivo S18', dim: '412×915', w: 412, h: 915, ratio: '20:9' },
      { id: 'honor-magic6', brand: 'honor', form: 'phone', name: '荣耀 Magic 6', dim: '432×960', w: 432, h: 960, ratio: '20:9' },
      { id: 'honor-100', brand: 'honor', form: 'phone', name: '荣耀 100', dim: '412×915', w: 412, h: 915, ratio: '20:9' },

      // ========== Android 折叠屏 ==========
      { id: 'huawei-mate-x5', brand: 'huawei', form: 'foldable', name: '华为 Mate X5 展开', dim: '720×840', w: 720, h: 840, ratio: '8:9.3' },
      { id: 'huawei-mate-x5-outer', brand: 'huawei', form: 'foldable', name: '华为 Mate X5 折叠', dim: '384×840', w: 384, h: 840, ratio: '21:9' },
      { id: 'xiaomi-mix-fold3', brand: 'xiaomi', form: 'foldable', name: '小米 MIX Fold 3 展开', dim: '720×960', w: 720, h: 960, ratio: '3:4' },
      { id: 'oppo-find-n3', brand: 'oppo', form: 'foldable', name: 'OPPO Find N3 展开', dim: '720×792', w: 720, h: 792, ratio: '10:11' },
      { id: 'vivo-x-fold3', brand: 'vivo', form: 'foldable', name: 'vivo X Fold3 展开', dim: '720×960', w: 720, h: 960, ratio: '3:4' },
      { id: 'honor-magic-v2', brand: 'honor', form: 'foldable', name: '荣耀 Magic V2 展开', dim: '720×892', w: 720, h: 892, ratio: '~9:11' },
      { id: 'honor-magic-vs3', brand: 'honor', form: 'foldable', name: '荣耀 Magic Vs3 展开', dim: '720×892', w: 720, h: 892, ratio: '~9:11' },
    ];

    // 微信小程序用的设备（直接复用 Android 直板机/折叠屏的尺寸）
    const MP_DEVICES = [
      { id: 'mp-iphone-15', form: 'mp', name: '微信 · iPhone 15', w: 393, h: 852, brand: 'mp' },
      { id: 'mp-iphone-se', form: 'mp', name: '微信 · iPhone SE', w: 375, h: 667, brand: 'mp' },
      { id: 'mp-huawei-mate60', form: 'mp', name: '微信 · 华为 Mate 60 Pro', w: 432, h: 960, brand: 'mp' },
      { id: 'mp-xiaomi-14', form: 'mp', name: '微信 · 小米 14', w: 412, h: 915, brand: 'mp' },
      { id: 'mp-oppo-findx7', form: 'mp', name: '微信 · OPPO Find X7', w: 432, h: 960, brand: 'mp' },
      { id: 'mp-vivo-x100', form: 'mp', name: '微信 · vivo X100', w: 432, h: 960, brand: 'mp' },
      { id: 'mp-honor-magic6', form: 'mp', name: '微信 · 荣耀 Magic 6', w: 432, h: 960, brand: 'mp' },
      { id: 'mp-huawei-mate-x5', form: 'mp', name: '微信 · 华为 Mate X5 展开', w: 720, h: 840, brand: 'mp' },
      { id: 'mp-honor-magic-v2', form: 'mp', name: '微信 · 荣耀 Magic V2 展开', w: 720, h: 892, brand: 'mp' },
    ];

    // 状态：哪些设备被勾选（含方向）
    const selected = new Map(); // key: deviceId + '_' + orient, value: { device, orient, w, h }

    function orientKey(id, orient) { return id + '_' + orient; }

    // ========================================================================
    // 左侧栏渲染
    // ========================================================================
    function buildGroup(containerId, devices, defaultOrient = 'portrait', groupLabel = '') {
      const container = document.getElementById(containerId);
      // 按品牌分子组
      const byBrand = {};
      devices.forEach(d => {
        const b = d.brand;
        if (!byBrand[b]) byBrand[b] = [];
        byBrand[b].push(d);
      });

      container.innerHTML = Object.entries(byBrand).map(([brand, list]) => {
        const brandName = ({
          'ios': 'Apple',
          'huawei': '华为',
          'xiaomi': '小米',
          'oppo': 'OPPO',
          'vivo': 'vivo',
          'honor': '荣耀',
          'mp': '通用',
        })[brand] || brand;
        const gid = `${containerId}-${brand}`;
        return `
          <div class="group open" id="${gid}">
            <div class="group-header" onclick="toggleGroup('${gid}')">
              <span class="arrow">▶</span>
              <span>${brandName}</span>
              <span class="count">${list.length}</span>
            </div>
            <div class="group-body">
              ${list.map(d => `
                <div class="device-item">
                  <input type="checkbox"
                         id="cb-${d.id}"
                         onchange="onCheck('${d.id}', '${d.form}', '${defaultOrient}', this.checked)">
                  <label for="cb-${d.id}" style="cursor:pointer;flex:1;">
                    ${d.name}
                    <span class="spec">${d.w}×${d.h}</span>
                  </label>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleGroup(gid) {
      document.getElementById(gid)?.classList.toggle('open');
    }

    function onCheck(deviceId, form, defaultOrient, checked) {
      const all = [...DEVICES, ...MP_DEVICES];
      const dev = all.find(d => d.id === deviceId);
      if (!dev) return;
      // 同时勾选竖屏 + 横屏
      for (const orient of ['portrait', 'landscape']) {
        const k = orientKey(deviceId, orient);
        if (checked) {
          const isLandscape = orient === 'landscape';
          selected.set(k, {
            device: dev,
            orient,
            w: isLandscape ? dev.h : dev.w,
            h: isLandscape ? dev.w : dev.h,
            form: dev.form,
          });
        } else {
          selected.delete(k);
        }
      }
      renderStage();
    }

    function selectAll(yes) {
      const ids = [...DEVICES, ...MP_DEVICES].map(d => d.id);
      ids.forEach(id => {
        const cb = document.getElementById('cb-' + id);
        if (cb && cb.checked !== yes) {
          cb.checked = yes;
          cb.dispatchEvent(new Event('change'));
        }
      });
    }

    function selectRecommended() {
      // 默认推荐：每品牌 1-2 个代表
      const recIds = [
        'iphone-15-pro-max',
        'huawei-mate60', 'xiaomi-14-pro', 'oppo-findx7', 'vivo-x100', 'honor-magic6',
        'huawei-mate-x5', 'xiaomi-mix-fold3', 'honor-magic-v2',
        'mp-iphone-15', 'mp-huawei-mate60', 'mp-honor-magic-v2',
      ];
      selectAll(false);
      recIds.forEach(id => {
        const cb = document.getElementById('cb-' + id);
        if (cb) {
          cb.checked = true;
          cb.dispatchEvent(new Event('change'));
        }
      });
    }

    // ========================================================================
    // 主区域渲染
    // ========================================================================
    function renderStage() {
      const stage = document.getElementById('stage');
      if (selected.size === 0) {
        stage.innerHTML = '<div class="main-empty">从左侧勾选要预览的设备型号</div>';
        return;
      }

      const items = Array.from(selected.values());
      stage.innerHTML = items.map(it => deviceCard(it)).join('');
    }

    function deviceCard(it) {
      const { device, orient, w, h, form } = it;
      const orientText = orient === 'portrait' ? '竖屏' : '横屏';
      const formTag = ({
        'phone': { class: 'phone', text: '手机' },
        'foldable': { class: 'foldable', text: '折叠屏' },
        'mp': { class: 'mp', text: '小程序' },
      })[form] || { class: '', text: form };

      const brandTag = ({
        'ios': 'iOS',
        'huawei': 'Harmony', 'xiaomi': 'MIUI', 'oppo': 'ColorOS',
        'vivo': 'OriginOS', 'honor': 'MagicOS',
      })[device.brand] || '通用';

      // iframe 高度按比例算（高度限制在 360~720px 之间）
      const aspect = w / h;
      const heightPx = Math.min(720, Math.max(360, 460 / aspect));
      const iframeUrl = `http://localhost:9000/?device=${encodeURIComponent(device.name)}&w=${w}&h=${h}&orient=${orient}`;

      let frameInner;
      if (form === 'mp') {
        // 微信小程序外壳：状态栏 + 导航栏 + 内容 + tabbar
        frameInner = `
          <div class="mp-shell">
            <div class="mp-statusbar">
              <span class="time">15:21</span>
              <span class="icons">📶 🔋</span>
              <div class="mp-capsule"></div>
            </div>
            <div class="mp-navbar">
              <span class="back">‹</span>
              <span class="title">节节高</span>
              <span class="more">···</span>
            </div>
            <div class="mp-body">
              <iframe src="${iframeUrl}" loading="lazy"
                      sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            </div>
            <div class="mp-tabbar">
              <div class="mp-tabbar-item active"><div class="icon"></div>新闻</div>
              <div class="mp-tabbar-item"><div class="icon"></div>研报</div>
              <div class="mp-tabbar-item"><div class="icon"></div>持仓</div>
            </div>
          </div>
        `;
      } else {
        frameInner = `<iframe src="${iframeUrl}" loading="lazy"
                             sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
      }

      return `
        <div class="device" data-form="${form}" data-orient="${orient}">
          <div class="device-label">
            <span class="device-name">${device.name}</span>
            <span class="device-tag ${formTag.class}">${formTag.text}</span>
            <span class="device-tag">${brandTag}</span>
          </div>
          <div class="device-label">
            <span class="device-dim">${w}×${h} · ${orientText} · ${device.ratio || ''}</span>
          </div>
          <div class="device-frame" style="height:${heightPx}px;">
            ${frameInner}
          </div>
        </div>
      `;
    }

    function reloadAll() {
      document.querySelectorAll('iframe').forEach(f => f.src = f.src);
    }

    // ========================================================================
    // 初始化
    // ========================================================================
    buildGroup('group-ios', DEVICES.filter(d => d.brand === 'ios'));
    buildGroup('group-android', DEVICES.filter(d => d.brand !== 'ios' && d.form === 'phone'));
    buildGroup('group-foldable', DEVICES.filter(d => d.form === 'foldable'));
    buildGroup('group-mp', MP_DEVICES);

    // 后端探活
    fetch('http://localhost:9999/api/health')
      .then(r => r.json())
      .then(j => {
        const s = document.getElementById('backend-status');
        s.textContent = '✓ ' + (j.service || 'ok');
        s.className = 'status ok';
      })
      .catch(() => {
        const s = document.getElementById('backend-status');
        s.textContent = '✗ 9999 offline';
        s.className = 'status err';
      });

    // 默认勾选「推荐」一组
    selectRecommended();
  </script>
</body>
</html>
